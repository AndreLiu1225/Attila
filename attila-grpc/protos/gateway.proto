syntax = "proto3";

package gateway;

service AttilaGateway {
    rpc Health(HealthRequest) returns (HealthResponse);

    // Test Method
    rpc SubmitTask(TaskRequest) returns (stream TaskResponse);

    rpc RunAgent(RunRequest) returns (stream AgentEvent);
}

message HealthRequest {
    string request_id = 1;
}

message HealthResponse {
    StatusType status = 1;
}

// Test TaskResponse message
message TaskResponse {
    string request_id = 1;
    string prompt = 2;
    string response = 3;
}

// Test TaskRequest message
message TaskRequest {
    string request_id = 1;
    string content = 2;
    EventType type = 3;
}

// Test EventType enum
enum EventType {
    PROMPT_EVENT = 0;
    TOOL_EVENT = 1;
}

// Test StatusType enum
enum StatusType {
    STATUS_UNSPECIFIED = 0;
    STATUS_ACTIVE = 1;
    STATUS_DEFERRED = 2;
    STATUS_FAILED = 3;
}

//*************************Actual Types****************************/
message RunRequest {
    string run_id = 1;
    string prompt = 2;
}

message AgentEvent {
  string run_id = 1;

  oneof event {
    RunStarted run_started = 2;
    ModelStarted model_started = 3;
    ModelFinished model_finished = 4;
    ToolStarted tool_started = 5;
    ToolFinished tool_finished = 6;
    RunCompleted run_completed = 7;
    RunFailed run_failed = 8;
  }
}

message RunStarted {
    string prompt = 1;
}

message ModelStarted {
    string model_name = 1;
    int32 step_number = 2;
}

message ToolCall {
    string tool_call_id = 1;
    string name = 2;
    string arguments_json = 3;
}

message ModelFinished {
    string text = 1;
    repeated ToolCall tool_calls = 2;
}

message ToolStarted {
    string tool_call_id = 1;
    string name = 2;
    string arguments_json = 3;
}
message ToolFinished {
    string tool_call_id = 1;
    string name = 2;
    string output = 3;
    bool ok = 4;
}
message RunCompleted {
    string final_text = 1;
}
message RunFailed {
    string message = 1;
}