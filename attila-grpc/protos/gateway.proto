syntax = "proto3";

package gateway;

service AttilaGateway {
    rpc Health(HealthRequest) returns (HealthResponse);

    rpc RunAgent(stream ClientMessage) returns (stream AgentEvent);

    rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);
}

message HealthRequest {
    string request_id = 1;
}

message HealthResponse {
    StatusType status = 1;
}

enum StatusType {
    STATUS_UNSPECIFIED = 0;
    STATUS_ACTIVE = 1;
    STATUS_DEFERRED = 2;
    STATUS_FAILED = 3;
}

message ClientMessage {
    oneof msg {
        RunRequest run_request = 1;
        ToolResult tool_result = 2;
    }
}

message ToolResult {
    string tool_call_id = 1;
    string output = 2;
    bool ok = 3;
}

message RunRequest {
    string run_id = 1;
    string prompt = 2;
}

message AgentEvent {
  string run_id = 1;

  oneof event {
    RunStarted run_started = 2;
    ModelStarted model_started = 3;
    ModelFinished model_finished = 4;
    ToolStarted tool_started = 5;
    ToolFinished tool_finished = 6;
    RunCompleted run_completed = 7;
    RunFailed run_failed = 8;
  }
}

message RunStarted {
    string prompt = 1;
}

message ModelStarted {
    string model_name = 1;
    int32 step_number = 2;
}

message ToolCall {
    string tool_call_id = 1;
    string name = 2;
    string arguments_json = 3;
}

message ModelFinished {
    string text = 1;
    repeated ToolCall tool_calls = 2;
}

message ToolStarted {
    string tool_call_id = 1;
    string name = 2;
    string arguments_json = 3;
}
message ToolFinished {
    string tool_call_id = 1;
    string name = 2;
    string output = 3;
    bool ok = 4;
}
message RunCompleted {
    string final_text = 1;
}
message RunFailed {
    string message = 1;
}

message ListMessagesRequest {
    string conversation_id = 1;
}

message StoredMessage {
    int64 id = 1;
    string sender = 2;
    string content = 3;
}

message ListMessagesResponse {
    repeated StoredMessage messages = 1;
}